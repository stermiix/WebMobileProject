<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Bairro - Entrar</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- ==============================
         TELA DE LOGIN
    ============================== -->

    <main class="login-container">


        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <div class="logo-icon">
                    🏠
                </div>

                <h1>
                    Meu Bairro
                </h1>

                <p>
                    Participe da melhoria da sua comunidade.
                </p>

            </div>



            <!-- FORMULÁRIO -->

            <form id="form-login">


                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                    >

                </div>



                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                    >

                </div>



                <div class="campo">

                    <label for="bairro">
                        Bairro
                    </label>

                    <input
                        type="text"
                        id="bairro"
                        placeholder="Digite seu bairro"
                        autocomplete="address-level2"
                    >

                </div>



                <button
                    type="submit"
                    class="botao-entrar"
                >
                    Entrar
                </button>


            </form>


            <!-- MENSAGEM -->

            <p
                id="mensagem-login"
                class="mensagem-login"
            ></p>


            <p class="login-info">
                Protótipo acadêmico do projeto Meu Bairro.
            </p>


        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script src="login.js"></script>


</body>

</html>
